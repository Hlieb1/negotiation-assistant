server:
  host: 0.0.0.0
  port: 8000

session:
  default_mode: fuzzy

video:
  enabled: true
  detector_backend: opencv   # opencv | yunet (fast) | retinaface (too slow on CPU)
  classifier: hsemotion      # hsemotion | deepface
  hsemotion_model: enet_b2_7 # enet_b2_7 | enet_b0_8_best_afew | enet_b0_8_best_vgaf
  face_margin: 0.1           # crop margin around the detected face, share of its width
  max_fps: 4
  max_width: 640
  equalize: false            # CLAHE on luminance for poor lighting
  min_face_size: 40
  smoothing_window_s: 1.5
  min_face_ratio: 0.3        # share of frames with a face in the window, below it the face is "not found"

audio:
  enabled: true
  denoise: false             # spectral gating (noisereduce); lowers emotion accuracy, see research notes
  speech_padding_s: 0.25     # context kept around detected speech for emotion and ASR
  vad_aggressiveness: 2      # webrtcvad 0..3
  vad_frame_ms: 30
  min_rms_db: -55            # frames quieter than this (after gain) are never speech
  target_level_db: -20       # slow gain control: loud speech frames are brought to this level
  max_gain_db: 30
  noise_margin_db: 6         # speech must be this much above the running noise floor
  voice_model: emotion2vec/emotion2vec_plus_large   # or emotion2vec/emotion2vec_plus_base
  voice_device: cuda:0
  min_speech_s: 0.5          # shorter speech in a chunk is not classified
  smoothing_window_s: 6.0

asr:
  enabled: true
  model: small               # small | medium | large-v3
  language: uk
  device: cuda
  compute_type: float16
  beam_size: 1
  min_pause_s: 0.6           # pause that ends an utterance
  max_utterance_s: 10.0

speaker:
  enabled: true
  source: speechbrain/spkrec-ecapa-voxceleb   # ECAPA-TDNN speaker embeddings
  savedir: models/spkrec-ecapa-voxceleb
  profile_path: profiles/owner.npy           # voice sample of the app user, recorded in the app
  device: cuda:0
  threshold: 0.35            # cosine similarity to the sample at or above which a phrase is "me"
  min_speech_s: 0.8          # shorter speech keeps the previous speaker label
  min_enroll_s: 6.0

fusion:
  emotion_weights: {face: 0.65, voice: 0.35}   # which emotion; face is more accurate (78 % vs 57 %)
  valence_weights: {face: 0.4, voice: 0.6}     # negative/neutral/positive; voice reaches 87 %
  prosody_arousal_weight: 0.5                  # share of arousal taken from pitch, loudness and tempo
  max_age_s: 6.0                               # older modality data is ignored
  state_switch_margin: 0.05                    # a new state must exceed the current one by this degree
  baseline_history: 30                         # speech chunks kept for the speaker's own prosody baseline
  baseline_min_samples: 3
  rules_path: rules/state_rules.yaml

decision:
  fuzzy_rules_path: rules/fuzzy_rules.txt
  replies_path: app/decision/replies_uk.json
  min_interval_s: 4.0        # hints not more often than this
  stable_s: 1.0              # a new state must hold this long before a hint
  min_confidence: 0.1
  history_size: 5            # previous hints passed to the module (no repeats)
  speech_min_interval_s: 2.0 # a finished phrase of the counterpart triggers a hint, not more often than this
  dialogue_turns: 6          # last phrases of the conversation passed to the LLM
  llm:
    enabled: true
    base_url: http://127.0.0.1:11434
    model: qwen3:8b          # or gemma3:4b if B is too slow
    prompt_path: app/decision/llm_prompt_uk.json
    timeout_s: 4.5           # after that the fuzzy reply is used
    temperature: 0.6
    max_tokens: 100
    keep_alive: 60m

storage:
  log_dir: logs
  record_media: false
  recordings_dir: recordings
